<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manduva House – 3D Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

<!-- Classic Three.js -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<!-- Classic OrbitControls (NON-MODULE) -->
<script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

<script>
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8f0e4);

  // Camera
  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
  );
  camera.position.set(90, 80, 130);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Controls (THIS WILL NOW WORK)
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(50, 0, 35);
  controls.enableDamping = true;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(150, 200, 150);
  scene.add(sun);

  // Plot
  const plot = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 69),
    new THREE.MeshLambertMaterial({ color: 0xcfe8c9 })
  );
  plot.rotation.x = -Math.PI / 2;
  plot.position.set(50, 0, 34.5);
  scene.add(plot);

  // House block
  const house = new THREE.Mesh(
    new THREE.BoxGeometry(50, 11, 40),
    new THREE.MeshLambertMaterial({ color: 0xf5f5f0 })
  );
  house.position.set(50, 5.5, 30);
  scene.add(house);

  // Roof (simple Manduva proxy)
  const roof = new THREE.Mesh(
    new THREE.CylinderGeometry(0, 45, 12, 4),
    new THREE.MeshLambertMaterial({ color: 0xa23b2a })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.set(50, 17, 30);
  scene.add(roof);

  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
