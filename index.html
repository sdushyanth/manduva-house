<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manduva House – 3D Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
  import * as THREE from "https://unpkg.com/three@0.152.2/build/three.module.js";
  import { OrbitControls } from "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js";

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8f0e4);

  // Camera
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(80, 80, 120);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(50, 0, 34.5);
  controls.enableDamping = true;
  controls.update();

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(150, 200, 150);
  scene.add(sun);

  // Plot: 100' x 69'
  const plot = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 69),
    new THREE.MeshLambertMaterial({ color: 0xcfe8c9 })
  );
  plot.rotation.x = -Math.PI / 2;
  plot.position.set(50, 0, 34.5);
  scene.add(plot);

  // Compound wall
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xb0b0b0 });
  function addWall(w, h, d, x, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    m.position.set(x, h/2, z);
    scene.add(m);
  }
  addWall(100, 6, 1, 50, 0);     // West
  addWall(100, 6, 1, 50, 69);    // East
  addWall(1, 6, 69, 0, 34.5);    // South
  addWall(1, 6, 69, 100, 34.5);  // North

  // House block: 50' x 40' x 11'
  const house = new THREE.Mesh(
    new THREE.BoxGeometry(50, 11, 40),
    new THREE.MeshLambertMaterial({ color: 0xf5f5f0 })
  );
  house.position.set(50, 5.5, 30);
  scene.add(house);

  // Courtyard pad (visual marker)
  const courtyard = new THREE.Mesh(
    new THREE.BoxGeometry(8, 0.4, 8),
    new THREE.MeshLambertMaterial({ color: 0x9a9a9a })
  );
  courtyard.position.set(55, 0.25, 32);
  scene.add(courtyard);

  // Simple sloped roof proxy
  const roof = new THREE.Mesh(
    new THREE.CylinderGeometry(0, 45, 12, 4, 1),
    new THREE.MeshLambertMaterial({ color: 0xa23b2a })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.set(50, 17, 30);
  scene.add(roof);

  // Trees (simple placeholders)
  function addTree(x, z) {
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.7, 6),
      new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
    );
    trunk.position.set(x, 3, z);
    scene.add(trunk);

    const crown = new THREE.Mesh(
      new THREE.SphereGeometry(3, 16, 16),
      new THREE.MeshLambertMaterial({ color: 0x2e8b57 })
    );
    crown.position.set(x, 7, z);
    scene.add(crown);
  }
  for (let i = 0; i < 25; i++) addTree(Math.random()*100, Math.random()*69);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
