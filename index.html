<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manduva House – 3D Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

<script>
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8f0e4);

  // Camera
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(80, 80, 120);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(50, 0, 35);
  controls.update();

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(100, 150, 100);
  scene.add(sun);

  // Plot (100 x 69)
  const plot = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 69),
    new THREE.MeshLambertMaterial({ color: 0xcfe8c9 })
  );
  plot.rotation.x = -Math.PI / 2;
  plot.position.set(50, 0, 34.5);
  scene.add(plot);

  // Compound wall
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xb0b0b0 });
  function wall(w, h, d, x, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    m.position.set(x, h/2, z);
    scene.add(m);
  }
  wall(100, 6, 1, 50, 0);     // West
  wall(100, 6, 1, 50, 69);    // East
  wall(1, 6, 69, 0, 34.5);    // South
  wall(1, 6, 69, 100, 34.5);  // North

  // House base (50 x 40)
  const house = new THREE.Mesh(
    new THREE.BoxGeometry(50, 11, 40),
    new THREE.MeshLambertMaterial({ color: 0xf5f5f0 })
  );
  house.position.set(50, 5.5, 30);
  scene.add(house);

  // Courtyard cut (visual)
  const courtyard = new THREE.Mesh(
    new THREE.BoxGeometry(8, 0.5, 8),
    new THREE.MeshLambertMaterial({ color: 0xa0a0a0 })
  );
  courtyard.position.set(55, 0.3, 32);
  scene.add(courtyard);

  // Sloped roof
  const roof = new THREE.Mesh(
    new THREE.CylinderGeometry(0, 45, 12, 4, 1),
    new THREE.MeshLambertMaterial({ color: 0xa23b2a })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.set(50, 17, 30);
  scene.add(roof);

  // Trees
  function tree(x, z) {
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.7, 6),
      new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
    );
    trunk.position.set(x, 3, z);
    scene.add(trunk);

    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(3),
      new THREE.MeshLambertMaterial({ color: 0x2e8b57 })
    );
    leaves.position.set(x, 7, z);
    scene.add(leaves);
  }

  for (let i = 0; i < 20; i++) {
    tree(Math.random()*100, Math.random()*69);
  }

  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
